
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: weather_db
    restart: always
    environment:
      POSTGRES_DB: weather_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weather_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: weather_api
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/weather_assistant
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
